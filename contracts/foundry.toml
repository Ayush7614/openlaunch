[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
# Uniswap v4 deps require 0.8.26 + cancun (transient storage); existing ^0.8.24
# sources compile unchanged under 0.8.26.
solc_version = "0.8.26"
evm_version = "cancun"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
