<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Inter:wght@500;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0b1020; }
  .banner { position: relative; width: 1600px; height: 440px; overflow: hidden; background: radial-gradient(1200px 600px at 18% 40%, #123bd6 0%, #0b1a5a 45%, #0b1020 100%); color: #fff; font-family: Inter, system-ui, sans-serif; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(900px 400px at 30% 50%, #000 0%, transparent 100%); }
  .glow { position: absolute; right: -180px; top: -220px; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,82,255,0.55), rgba(0,82,255,0)); }
  .ring { position: absolute; right: 120px; top: 60px; width: 320px; height: 320px; border-radius: 50%; border: 22px solid rgba(255,255,255,0.08); }
  .ring2 { position: absolute; right: 60px; top: 0; width: 440px; height: 440px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.10); }
  .content { position: absolute; left: 88px; top: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .row { display: flex; align-items: center; gap: 26px; }
  .tile { width: 108px; height: 108px; border-radius: 26px; background: #0052FF; box-shadow: 0 18px 50px rgba(0,82,255,0.45), inset 0 0 0 2px rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; }
  .word { font-family: Unbounded, Inter, sans-serif; font-weight: 800; font-size: 118px; letter-spacing: -0.03em; line-height: 1; }
  .word span { color: #7aa2ff; }
  .tag { font-size: 34px; font-weight: 600; color: rgba(255,255,255,0.92); letter-spacing: -0.01em; }
  .tag b { color: #fff; }
  .chips { display: flex; gap: 12px; margin-top: 4px; }
  .chip { font-family: "Space Mono", monospace; font-weight: 700; font-size: 17px; padding: 10px 16px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); color: #fff; letter-spacing: 0.02em; }
  .chip.up { border-color: rgba(74,222,128,0.5); color: #86efac; }
</style></head>
<body>
<div class="banner">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="ring2"></div>
  <div class="ring"></div>
  <div class="content">
    <div class="row">
      <div class="tile">
        <svg width="72" height="72" viewBox="0 0 32 32"><path fill="#FFFFFF" fill-rule="evenodd" d="M10.5 13a6.5 6.5 0 1 1 0 13a6.5 6.5 0 1 1 0-13ZM10.5 16.4a3.1 3.1 0 1 0 0 6.2a3.1 3.1 0 1 0 0-6.2Z"/><rect x="19.5" y="6" width="4.6" height="20" rx="1.4" fill="#FFFFFF"/><rect x="19.5" y="21.4" width="8.2" height="4.6" rx="1.4" fill="#FFFFFF"/></svg>
      </div>
      <div class="word">OPENLAUNCH<span>.LOL</span></div>
    </div>
    <div class="tag">Launch a token. <b>Free.</b> Open source. Liquidity locked forever.</div>
    <div class="chips">
      <span class="chip up">0% PLATFORM FEE</span>
      <span class="chip">BASE</span>
      <span class="chip">ROBINHOOD CHAIN</span>
      <span class="chip">UNISWAP V4</span>
    </div>
  </div>
</div>
</body></html>
